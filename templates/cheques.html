<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cheques</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/estilos.css">
    <style>
        *{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.page{max-width:1180px;margin:auto;padding:30px 22px}.heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}h1{margin:0;font-size:27px}.subtitle{margin:4px 0 0;color:#64748b}button,input,select{font:inherit}.btn{border:0;border-radius:7px;padding:10px 15px;cursor:pointer;font-weight:600}.primary{background:#2563eb;color:white}.primary:hover{background:#1d4ed8}.card{background:#fff;border:1px solid #e2e8f0;border-radius:11px;box-shadow:0 3px 12px #0f172a08}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:18px}.stat{padding:17px 19px}.label{display:block;color:#64748b;font-size:13px}.value{display:block;font-size:22px;font-weight:700;margin-top:4px}.toolbar{display:flex;gap:11px;padding:15px;border-bottom:1px solid #e2e8f0}.toolbar input,.toolbar select{min-height:40px;border:1px solid #cbd5e1;border-radius:7px;padding:8px 10px;background:white;color:#172033}.search{flex:1;min-width:160px}.filter{width:180px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:12px 15px;border-bottom:1px solid #eef2f7}th{background:#fafbfd;color:#64748b;text-transform:uppercase;font-size:12px;letter-spacing:.04em}tbody tr:last-child td{border:0}.badge{display:inline-block;padding:4px 9px;border-radius:99px;font-size:12px;font-weight:650}.Pendiente{background:#fff7ed;color:#c2410c}.Cobrado{background:#ecfdf5;color:#047857}.Rechazado{background:#fef2f2;color:#b91c1c}.delete{border:0;background:none;color:#2563eb;font-weight:600;cursor:pointer}.empty{display:none;text-align:center;color:#64748b;padding:32px 12px}.footer{padding:11px 15px;border-top:1px solid #e2e8f0;color:#64748b;font-size:13px}dialog{width:min(470px,calc(100% - 24px));border:0;border-radius:11px;padding:0;box-shadow:0 20px 60px #0f172a40}dialog::backdrop{background:#0f172a70}.modal-head,.modal-actions{padding:15px 19px}.modal-head{display:flex;justify-content:space-between;border-bottom:1px solid #e2e8f0}.modal-head h2{font-size:19px;margin:0}.close{border:0;background:none;font-size:23px;color:#64748b;cursor:pointer}.fields{padding:17px 19px;display:grid;gap:12px}.fields label{display:grid;gap:5px;font-size:13px;font-weight:600}.fields input,.fields select{width:100%;min-height:39px;border:1px solid #cbd5e1;border-radius:7px;padding:8px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;border-top:1px solid #e2e8f0}.secondary{background:#f1f5f9;color:#172033}@media(max-width:650px){.page{padding:20px 13px}.heading{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.search{flex-basis:100%}.filter{flex:1;width:auto}}
    </style>
</head>
<body class="{{ 'modo-milagritos' if milagritos else '' }}">
    <!-- 1. BARRA SUPERIOR -->
    <header class="barra-superior py-3 px-4 shadow-sm">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <a href="/" class="btn btn-sm btn-outline-light px-3 fw-bold rounded-pill">
                &larr; ATRÁS
            </a>
            <a href="/backup" class="btn btn-capsula">
                💾
            </a>
            <h1 class="h4 mb-0 text-uppercase fw-bold letter-spacing-1">
                Clientes e Historial de Remitos
            </h1>
            <a href="/toggle-milagritos" class="btn btn-modo-milagritos">
                🧚
            </a>
            <img src="/static/logo.png" alt="Gomería El Puente" class="logo-nav">
        </div>
    </header>
    <main class="page">
        <header class="heading"><div><h1>Cheques</h1><p class="subtitle">Consultá y administrá los cheques.</p></div><button class="btn primary" id="new-check">＋ Nuevo cheque</button></header>
        <section class="stats" aria-label="Resumen"><div class="card stat"><span class="label">Total registrados</span><span class="value" id="total">0</span></div><div class="card stat"><span class="label">Pendientes</span><span class="value" id="pending">0</span></div><div class="card stat"><span class="label">Importe pendiente</span><span class="value" id="amount">$ 0,00</span></div></section>
        <section class="card" aria-label="Listado de cheques"><div class="toolbar"><input id="search" class="search" type="search" placeholder="Buscar por cliente, banco o número…" aria-label="Buscar"><select id="status-filter" class="filter" aria-label="Filtrar por estado"><option value="">Todos los estados</option><option>Pendiente</option><option>Cobrado</option><option>Rechazado</option></select><input id="date-filter" class="filter" type="date" aria-label="Fecha de pago"></div>
        <div class="table-wrap"><table><thead><tr><th>Número</th><th>Cliente</th><th>Banco</th><th>Emisión</th><th>Fecha de pago</th><th>Importe</th><th>Estado</th><th></th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty">No hay cheques para mostrar. Registrá uno con “Nuevo cheque”.</div></div><div class="footer" id="count">0 cheques</div>
        </section>
    </main>
    <dialog id="modal"><form id="form"><div class="modal-head"><h2>Registrar cheque</h2><button type="button" class="close" id="close" aria-label="Cerrar">×</button></div><div class="fields"><label>Número<input name="number" required maxlength="30"></label><label>Cliente<input name="client" required maxlength="100"></label><label>Banco<input name="bank" required maxlength="80"></label><label>Fecha de emisión<input name="issue" type="date" required></label><label>Fecha de pago<input name="payment" type="date" required></label><label>Importe<input name="amount" type="number" min="0.01" step="0.01" required></label><label>Estado<select name="status"><option>Pendiente</option><option>Cobrado</option><option>Rechazado</option></select></label></div><div class="modal-actions"><button type="button" class="btn secondary" id="cancel">Cancelar</button><button type="submit" class="btn primary">Guardar cheque</button></div></form></dialog>
    <script>
        (()=>{const checks=[];const rows=document.getElementById('rows'),modal=document.getElementById('modal'),form=document.getElementById('form');const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS'}).format(n);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const q=document.getElementById('search').value.trim().toLowerCase(),status=document.getElementById('status-filter').value,date=document.getElementById('date-filter').value;const shown=checks.filter(c=>(!q||[c.number,c.client,c.bank].some(v=>v.toLowerCase().includes(q)))&&(!status||c.status===status)&&(!date||c.payment===date));rows.innerHTML=shown.map(c=>{const i=checks.indexOf(c);return `<tr><td>${esc(c.number)}</td><td>${esc(c.client)}</td><td>${esc(c.bank)}</td><td>${esc(c.issue)}</td><td>${esc(c.payment)}</td><td>${money(Number(c.amount))}</td><td><span class="badge ${esc(c.status)}">${esc(c.status)}</span></td><td><button class="delete" data-delete="${i}" type="button">Eliminar</button></td></tr>`}).join('');document.getElementById('empty').style.display=shown.length?'none':'block';document.getElementById('count').textContent=`${shown.length} ${shown.length===1?'cheque':'cheques'}`;document.getElementById('total').textContent=checks.length;const pending=checks.filter(c=>c.status==='Pendiente');document.getElementById('pending').textContent=pending.length;document.getElementById('amount').textContent=money(pending.reduce((sum,c)=>sum+Number(c.amount),0))}document.getElementById('new-check').onclick=()=>modal.showModal();document.getElementById('close').onclick=()=>modal.close();document.getElementById('cancel').onclick=()=>modal.close();['search','status-filter','date-filter'].forEach(id=>document.getElementById(id).addEventListener('input',render));rows.addEventListener('click',e=>{const b=e.target.closest('[data-delete]');if(b){checks.splice(Number(b.dataset.delete),1);render()}});form.addEventListener('submit',e=>{e.preventDefault();checks.push(Object.fromEntries(new FormData(form)));form.reset();modal.close();render()});render()})();
    </script>
</body>
</html>
