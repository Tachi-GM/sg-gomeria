<table class="table table-hover align-middle mb-0">
    <thead class="table-light">
        <tr class="text-secondary small text-uppercase">
            <th class="py-3 px-4" onclick="ordenarTabla(0)" style="cursor: pointer;">Fecha ⇅</th>
            <th class="py-3" onclick="ordenarTabla(1, true)" style="cursor: pointer;">N° Remito ⇅</th>
            <th class="py-3" onclick="ordenarTabla(2)" style="cursor: pointer;">Empresa ⇅</th>
            <th class="py-3" onclick="ordenarTabla(3)" style="cursor: pointer;">Detalles</th>
            <th class="py-3 text-end" onclick="ordenarTabla(4, true)" style="cursor: pointer;">Total ⇅</th>
            <th class="py-3 text-center" style="width: 75px;">Pago</th>
            <th class="py-3 text-center" style="width: 105px;">Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% include "componentes/filas_remitos.html" %}
    </tbody>
</table>

<!-- Modal Editar Remito -->
<div class="modal fade" id="modalEditarRemito" tabindex="-1" aria-labelledby="modalEditarRemitoLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-light">
                <h5 class="modal-title fw-bold text-dark" id="modalEditarRemitoLabel">✏️ Editar Remito</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <form id="form-editar-remito">
                <div class="modal-body p-4">
                    <div id="alerta-error-modal" class="alert alert-danger d-none py-2 small" role="alert"></div>
                    <input type="hidden" name="id_trabajo" id="edit-id-trabajo">
                    <div class="mb-3">
                        <label for="edit-fecha" class="form-label small fw-bold text-secondary">Fecha</label>
                        <input type="date" class="form-control" id="edit-fecha" name="fecha" required>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-4">
                            <label for="edit-tipo" class="form-label small fw-bold text-secondary">Tipo</label>
                            <select class="form-select" id="edit-tipo" name="tipo" required>
                                <option value="OI">OI</option>
                                <option value="OIB">OIB</option>
                            </select>
                        </div>
                        <div class="col-8">
                            <label for="edit-remito" class="form-label small fw-bold text-secondary">N° Remito</label>
                            <input type="text" class="form-control" id="edit-remito" name="remito" required>
                        </div>
                    </div>
                    <div id="edit-remito-hint" class="form-text small text-muted">
                        OI: 5 dígitos numéricos (ej. 12345). OIB: 00 seguido de 4 dígitos (ej. 001234).
                    </div>
                </div>
                <div class="modal-footer bg-light border-0">
                    <button type="button" class="btn btn-outline-secondary rounded-pill px-3" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold" id="btn-guardar-edicion">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>
