<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Gomería El Puente{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/estilos.css">
    {% block extra_css %}{% endblock %}
</head>
<body class="{{ 'modo-milagritos' if milagritos else '' }}">
    <!-- Barra superior única compartida -->
    <header class="barra-superior py-3 px-4 shadow-sm mb-4">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            {% block atras %}
            <a href="/" class="btn btn-sm btn-outline-light px-3 fw-bold rounded-pill">
                &larr; ATRÁS
            </a>
            {% endblock %}
            <a href="/backup" class="btn btn-capsula">
                💾
            </a>
            <h1 class="h4 mb-0 text-uppercase fw-bold letter-spacing-1">
                {% block subtitle %}{% endblock %}
            </h1>
            <a href="/toggle-milagritos" class="btn btn-modo-milagritos">
                🧚
            </a>
            <img src="/static/logo.png" alt="Gomería El Puente" class="logo-nav">
        </div>
    </header>
    <!-- Acá se inserta el contenido particular de cada página -->
    <main>
        {% block content %}{% endblock %}
    </main>
    <!-- Scripts compartidos -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
