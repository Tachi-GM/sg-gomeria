<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Sistema de Gestión</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/estilos.css">
    <style>
        .btn-capsula{
            padding: 6px 16px;
        }
    </style>
</head>

<body class="{{ 'modo-milagritos' if milagritos else '' }}">
    <div class="container-fluid vh-100 p-0 overflow-hidden">
        <div class="row h-100 g-0">
            <!-- Mitad Izquierda: Menú -->
            <div class="col-md-6 bg-azul-izq d-flex flex-column justify-content-between align-items-center py-5 position-relative">

                <a href="/backup" class="btn btn-capsula position-absolute top-1 start-0 m-3">
                    💾
                </a>

                <a href="/toggle-milagritos" class="btn btn-modo-milagritos position-absolute top-0 start-0 m-3">
                    🧚
                </a>

                <div></div>

                <div class="d-flex flex-column gap-4 w-100 align-items-center">
                    <a href="{{ url_for('mataburros') }}" class="btn btn-capsula px-5 shadow-sm col-8 col-sm-6 text-decoration-none text-center">
                        Nuevo Remito
                    </a>
                    <a href="{{ url_for('clientes') }}" class="btn btn-capsula px-5 shadow-sm col-8 col-sm-6 text-decoration-none text-center">
                        Clientes
                    </a>
                    <a href="{{ url_for('precios') }}" class="btn btn-capsula px-5 shadow-sm col-8 col-sm-6 text-decoration-none text-center">
                        Precios
                    </a>
                </div>

                <div class="d-flex flex-column align-items-center gap-2">
                    <a href="{{ url_for('salir') }}" class="link-salir text-decoration-none">
                        Salir del sistema
                    </a>
                    <div class="texto-pie fw-bold">
                        El Puente Gomería <span class="hada-decorativa">🧚</span>
                    </div>
                </div>
            </div>

            <!-- Mitad Derecha: Logo nítido y transparente -->
            <div class="col-md-6 bg-white d-flex justify-content-center align-items-center p-5">
                <img src="/static/logo.png" alt="El Puente Gomería" class="logo-home">
            </div>
        </div>
    </div>
</body>
</html>
