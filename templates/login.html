<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Gomería El Puente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/estilos.css">
    <style>
        body {
            background-color: var(--crema);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .login-card {
            background-color: var(--blanco);
            border: 2px solid var(--arena);
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 440px;
            padding: 40px 35px;
            text-align: center;
            position: relative;
        }
        .login-logo {
            max-height: 85px;
            width: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.08));
        }
        .btn-ingresar {
            background-color: var(--azul);
            color: var(--blanco);
            font-weight: 700;
            border: none;
            border-radius: 10px;
            padding: 12px;
            width: 100%;
            font-size: 1rem;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }
        .btn-ingresar:hover {
            background-color: var(--azul-hover);
            color: var(--blanco);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(26, 66, 184, 0.25);
        }
        .form-control-custom {
            border: 1.5px solid var(--arena);
            border-radius: 8px;
            padding: 11px 14px;
            font-size: 0.95rem;
            background-color: #fdfdfd;
        }
        .form-control-custom:focus {
            border-color: var(--azul);
            box-shadow: 0 0 0 3px rgba(26, 66, 184, 0.15);
            background-color: var(--blanco);
        }
        .pista-evaluador {
            background-color: var(--crema);
            border: 1px dashed var(--naranja);
            color: var(--texto-oscuro);
            font-size: 0.78rem;
            padding: 8px 12px;
            border-radius: 8px;
            margin-top: 25px;
        }
        .btn-milagritos-flotante {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.2rem;
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        .btn-milagritos-flotante:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        /* Modo Milagritos */
        body.modo-milagritos {
            background-color: var(--rosa-claro);
        }
        body.modo-milagritos .login-card {
            border-color: var(--rosa-borde);
            box-shadow: 0 12px 30px rgba(201, 24, 74, 0.1);
        }
        body.modo-milagritos .btn-ingresar {
            background-color: var(--rosa-principal);
            color: white;
        }
        body.modo-milagritos .btn-ingresar:hover {
            background-color: var(--magenta-texto);
        }
        body.modo-milagritos .pista-evaluador {
            background-color: #fff5f7;
            border-color: var(--rosa-principal);
        }
    </style>
</head>
<body class="{{ 'modo-milagritos' if milagritos else '' }}">

    <div class="login-card">
        <!-- Acceso rápido a Modo Milagritos -->
        <a href="/toggle-milagritos" class="btn-milagritos-flotante" title="Alternar Modo Milagritos">🧚</a>

        <!-- Logo oficial de la gomería -->
        <img src="/static/logo.png" alt="Gomería El Puente" class="login-logo">

        <h4 class="fw-bold mb-1" style="color: var(--azul-oscuro);">Iniciar Sesión</h4>
        <p class="text-muted small mb-4">Ingresá tus credenciales para acceder al sistema</p>

        <!-- Mensajes Flash de error o aviso -->
        {% with mensajes = get_flashed_messages(with_categories=true) %}
            {% if mensajes %}
                {% for categoria, msg in mensajes %}
                    <div class="alert alert-{{ categoria }} alert-dismissible fade show text-start py-2 px-3 small" role="alert">
                        {{ msg }}
                        <button type="button" class="btn-close py-2 px-3" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Formulario -->
        <form method="POST" action="/login">
            <div class="mb-3 text-start">
                <label for="usuario" class="form-label small fw-bold text-secondary mb-1">USUARIO</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0" style="border-color: var(--arena);">👤</span>
                    <input type="text" id="usuario" name="usuario" class="form-control form-control-custom border-start-0" 
                           placeholder="ej. admin" required autofocus>
                </div>
            </div>

            <div class="mb-4 text-start">
                <label for="password" class="form-label small fw-bold text-secondary mb-1">CONTRASEÑA</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0" style="border-color: var(--arena);">🔒</span>
                    <input type="password" id="password" name="password" class="form-control form-control-custom border-start-0" 
                           placeholder="••••••••" required>
                    <button type="button" class="btn btn-ojo-clave" data-ojo-clave="password" aria-label="Mostrar contraseña" aria-pressed="false" title="Mostrar contraseña"><svg class="ojo-abierto" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="ojo-cerrado" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 7 11 7a19.9 19.9 0 0 1-3.17 4.19M1 1l22 22"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg></button>
                </div>
            </div>

            <button type="submit" class="btn btn-ingresar">
                INGRESAR AL SISTEMA
            </button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/ver-contrasena.js') }}"></script>
</body>
</html>
